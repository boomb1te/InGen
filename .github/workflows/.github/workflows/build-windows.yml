name: Build InGen for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name InGen --icon=icons\ingen_icon.ico --collect-data docxcompose --hidden-import docxcompose ingen_gui.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InGen-Windows
          path: dist/**
